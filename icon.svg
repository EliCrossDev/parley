<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a6b74"/><stop offset="0.5" stop-color="#454a5c"/><stop offset="1" stop-color="#272a3a"/>
    </linearGradient>
    <!-- One bubble outline with the tail drawn into it; reused mirrored for the second speaker -->
    <path id="bubble" d="M160 0 C248 0 318 52 318 118 C318 184 248 236 160 236 C144 236 128 234 113 230 L44 276 C34 283 22 274 26 263 L48 210 C18 186 2 154 2 118 C2 52 72 0 160 0 Z"/>
