<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a14"/><stop offset="0.55" stop-color="#1b2a44"/><stop offset="1" stop-color="#3a3550"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4766"/><stop offset="1" stop-color="#1e2740"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#sea)"/>
  <!-- them: dark bubble, right, tail to the right -->
  <g>
    <rect x="200" y="196" width="236" height="150" rx="75" fill="url(#dark)" stroke="rgba(255,255,255,0.28)" stroke-width="4"/>
    <path d="M436 300 L464 366 L388 338 Z" fill="#1e2740"/>
  </g>
  <!-- you: white bubble, left, tail to the left, overlapping -->
  <g>
    <rect x="76" y="142" width="236" height="150" rx="75" fill="#f7f7fb"/>
    <path d="M76 246 L48 312 L124 284 Z" fill="#f7f7fb"/>
  </g>
  <!-- the overlap: mint equals, "understood" -->
  <rect x="222" y="212" width="68" height="18" rx="9" fill="#7cffc4"/>
  <rect x="222" y="250" width="68" height="18" rx="9" fill="#7cffc4"/>
</svg>
